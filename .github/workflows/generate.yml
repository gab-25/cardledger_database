name: Generate catalog

on:
  schedule:
    # After the Cardmarket price guide and the TCGCSV rebuild.
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: generate
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.0"
          python-version: "3.14"
      - run: uv sync --no-dev
      - run: uv run cardledger-db generate
        env:
          CARDLEDGER_S3_BUCKET: ${{ secrets.CARDLEDGER_S3_BUCKET }}
          CARDLEDGER_S3_ENDPOINT: ${{ secrets.CARDLEDGER_S3_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
