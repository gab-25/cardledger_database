[project]
name = "cardledger-database"
version = "1.0.0"
description = "Generator of the CardLedger card catalog"
requires-python = ">=3.14"
license = { text = "GPL-3.0-only" }
dependencies = ["httpx", "boto3", "python-dotenv", "cardledger-vision"]

[project.scripts]
cardledger-db = "cardledger_database.cli:run"

[tool.uv.sources]
cardledger-vision = { git = "https://github.com/gab-25/cardledger_vision.git", tag = "v0.1.0" }

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cardledger_database"]

[tool.pytest.ini_options]
testpaths = ["tests"]
