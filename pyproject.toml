[project]
name = "cardledger-database"
version = "0.1.0"
description = "Nightly generator of the CardLedger card catalog"
requires-python = ">=3.14"
license = { text = "GPL-3.0-only" }
dependencies = ["httpx", "boto3"]

[project.scripts]
cardledger-db = "cardledger_database.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cardledger_database"]

[tool.pytest.ini_options]
testpaths = ["tests"]
